[package]
name = "nuzzle-desktop"
version = "0.3.0"
description = "Native floating companion for AI coding agents"
authors = ["Nuzzle contributors"]
edition = "2021"

[lib]
name = "nuzzle_lib"
path = "src/lib.rs"

[[bin]]
name = "Nuzzle"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
dirs = "6"
getrandom = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
thiserror = "2"
toml = "0.9"
toml_edit = "0.23"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
strip = "symbols"
