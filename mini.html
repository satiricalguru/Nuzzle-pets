<!DOCTYPE html>
<html lang="en" class="transparent-bg">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuzzle — Companion</title>
    <link rel="icon" type="image/svg+xml" href="/public/nuzzle-logo.svg" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      :root {
        --mini-pet-size: 160px;
      }
      html,
      body,
      html.transparent-bg,
      body.transparent-bg,
      body.mini-body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        min-width: 0 !important;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent !important;
        background-color: transparent !important;
        overflow: hidden;
        user-select: none;
        -webkit-user-select: none;
      }
      /* =========================================================
         SPEECH / STATUS NOTIFICATION REGION (Floating Above Pet)
         ========================================================= */
      .toast-region {
        position: fixed;
        top: 6px !important;
        bottom: auto !important;
        left: 100px !important;
        transform: translateX(-50%) !important;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 4px;
        z-index: 1000;
        pointer-events: none;
        width: max-content;
        max-width: 192px;
        transition: left 0.15s ease;
      }
      body.mode-sprite.menu-left .toast-region {
        left: 265px !important;
      }
      .toast {
        background: rgba(18, 16, 14, 0.82) !important;
        backdrop-filter: blur(14px) saturate(130%);
        -webkit-backdrop-filter: blur(14px) saturate(130%);
        border: 1px solid rgba(255, 255, 255, 0.24) !important;
        border-radius: 12px !important;
        padding: 4px 9px !important;
        color: #fdfbf7 !important;
        font-size: 11px !important;
        font-weight: 500;
        letter-spacing: -0.01em;
        box-shadow: 0 4px 18px rgba(0, 0, 0, 0.4), 0 0 0 1px rgba(0, 0, 0, 0.2) inset !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.7);
        display: inline-flex !important;
        align-items: center;
        gap: 5px;
        max-width: 188px;
        line-height: 1.25;
        text-align: center;
        word-break: break-word;
        pointer-events: none !important;
        animation: speech-pop-down 0.22s cubic-bezier(0.16, 1, 0.3, 1) both;
        position: relative;
      }
      .toast::after {
        content: '';
        position: absolute;
        bottom: -3px;
        left: 50%;
        width: 6px;
        height: 6px;
        background: rgba(18, 16, 14, 0.78);
        border-right: 1px solid rgba(255, 255, 255, 0.24);
        border-bottom: 1px solid rgba(255, 255, 255, 0.24);
        transform: translateX(-50%) rotate(45deg);
      }
      .toast span:first-child {
        color: var(--coral, #ef7861);
        font-size: 11px;
      }
      @keyframes speech-pop-down {
        from {
          opacity: 0;
          transform: translateY(-8px) scale(0.92);
        }
        to {
          opacity: 1;
          transform: translateY(0) scale(1);
        }
      }
      .toast.fade {
        animation: speech-fade-up 0.2s ease both !important;
      }
      @keyframes speech-fade-up {
        to {
          opacity: 0;
          transform: translateY(-6px) scale(0.95);
        }
      }

      /* Card Mode toast override (bottom-anchored) */
      body.mode-card .toast-region {
        top: auto !important;
        bottom: 12px !important;
        max-width: 260px;
      }
      body.mode-card .toast::after {
        display: none !important;
      }

      /* =========================================================
         MODE: SPRITE (Codex-Style Borderless Transparent Overlay)
         ========================================================= */
      body.mode-sprite .mini-container {
        width: 100%;
        height: 100%;
        background: transparent !important;
        background-color: transparent !important;
        border: none !important;
        box-shadow: none !important;
        backdrop-filter: none !important;
        -webkit-backdrop-filter: none !important;
        padding: 34px 0 0;
        display: flex;
        flex-direction: row;
        align-items: flex-start;
        justify-content: flex-start;
        position: relative;
        text-align: center;
        box-sizing: border-box;
        overflow: visible;
      }
      body.mode-sprite .mini-topbar,
      body.mode-sprite .mini-badge,
      body.mode-sprite .mini-name,
      body.mode-sprite .mini-quote,
      body.mode-sprite .mini-status-bar {
        display: none !important;
      }
      body.mode-sprite .mini-stage {
        width: 200px;
        height: 186px;
        flex-shrink: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        position: relative;
        margin: 0;
        transition: margin 0.15s ease;
      }
      body.mode-sprite.menu-left .mini-stage {
        margin-left: 165px;
      }
      body.mode-sprite .mini-art-wrapper {
        position: relative;
        width: 156px;
        height: 156px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
      }
      body.mode-sprite .mini-art-wrapper:active {
        cursor: grabbing;
      }
      body.mode-sprite .mini-art {
        width: 150px;
        height: 156px;
        background-color: transparent !important;
        background-repeat: no-repeat;
        background-size: 800% 900%;
        border-radius: 0 !important;
        box-shadow: none !important;
        filter: none;
        cursor: grab;
        image-rendering: -webkit-optimize-contrast;
        image-rendering: pixelated;
        transition: transform 0.15s ease;
      }
      body.mode-sprite .mini-art:hover {
        transform: scale(1.03);
      }
      body.mode-sprite .mini-art:active {
        transform: scale(0.96);
      }
      body.mode-sprite .mini-art.gif-pet {
        background-size: contain !important;
        background-position: center center !important;
      }

      /* Compact Floating Pill & Dropdown in Sprite Mode */
      body.mode-sprite .mini-hud {
        position: absolute;
        bottom: 4px;
        top: auto;
        left: 0;
        width: 200px;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 100;
        pointer-events: none;
        transition: left 0.15s ease;
      }
      body.mode-sprite.menu-left .mini-hud {
        left: 165px;
      }
      body.mode-sprite .mini-pill-dock {
        pointer-events: auto;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: rgba(22, 20, 18, 0.84);
        backdrop-filter: blur(14px);
        -webkit-backdrop-filter: blur(14px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 999px;
        padding: 2px 7px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.42);
        opacity: 0.4;
        transform: translateY(2px);
        transition: opacity 0.2s ease, transform 0.2s ease, background 0.2s ease;
      }
      body.mode-sprite .mini-container:hover .mini-pill-dock,
      body.mode-sprite .mini-container:focus-within .mini-pill-dock,
      body.mode-sprite .mini-hud.menu-open .mini-pill-dock {
        opacity: 1;
        transform: translateY(0);
        background: rgba(22, 20, 18, 0.94);
      }
      body.mode-sprite .mini-pill-btn {
        background: transparent;
        color: #ede8e1;
        border: none;
        border-radius: 999px;
        width: 26px;
        height: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.15s ease, transform 0.15s ease, color 0.15s ease;
      }
      body.mode-sprite .mini-pill-btn:hover {
        background: rgba(255, 255, 255, 0.16);
        transform: scale(1.08);
      }
      body.mode-sprite .mini-dropdown-trigger {
        font-size: 16px;
        line-height: 1;
        letter-spacing: 0.5px;
      }

      /* Side Flyout Menu - Opens to the side of pet, perfectly aligned above dock */
      body.mode-sprite .mini-dropdown-menu {
        display: none;
        position: absolute;
        left: 196px;
        bottom: 0px;
        top: auto;
        right: auto;
        transform: none;
        background: rgba(20, 18, 16, 0.96);
        backdrop-filter: blur(24px);
        -webkit-backdrop-filter: blur(24px);
        border: 1px solid rgba(255, 255, 255, 0.16);
        border-radius: 12px;
        padding: 5px;
        min-width: 156px;
        box-shadow: 0 16px 40px rgba(0, 0, 0, 0.65), 0 0 0 1px rgba(255, 255, 255, 0.08) inset;
        flex-direction: column;
        gap: 2px;
        z-index: 200;
        pointer-events: auto;
        animation: menu-slide-right 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body.mode-sprite.menu-left .mini-dropdown-menu {
        left: auto;
        right: 196px;
        animation: menu-slide-left 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      }
      body.mode-sprite .mini-hud.menu-open .mini-dropdown-menu {
        display: flex;
      }
      @keyframes menu-slide-right {
        from { opacity: 0; transform: translateX(-8px) scale(0.96); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }
      @keyframes menu-slide-left {
        from { opacity: 0; transform: translateX(8px) scale(0.96); }
        to { opacity: 1; transform: translateX(0) scale(1); }
      }
      body.mode-sprite .mini-menu-item {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        padding: 6px 9px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: #ede8e1;
        font-size: 11px;
        font-weight: 500;
        text-align: left;
        cursor: pointer;
        transition: background 0.12s ease, transform 0.12s ease, color 0.12s ease;
      }
      body.mode-sprite .mini-menu-item:hover {
        background: rgba(255, 255, 255, 0.12);
        color: #ffffff;
        transform: translateX(1px);
      }
      body.mode-sprite .menu-icon {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 15px;
        height: 15px;
        opacity: 0.85;
        color: currentColor;
        flex-shrink: 0;
      }
      body.mode-sprite .mini-menu-item:hover .menu-icon {
        opacity: 1;
      }
      body.mode-sprite .menu-divider {
        height: 1px;
        background: rgba(255, 255, 255, 0.08);
        margin: 3px 0;
      }
      body.mode-sprite .mini-menu-item.item-danger:hover {
        background: rgba(234, 90, 71, 0.2);
        color: #ff7f6e;
      }

      /* In card mode, hide sprite pill/dropdown */
      body.mode-card .mini-hud {
        display: none !important;
      }

      /* =========================================================
         MODE: CARD (Original Widget Card UI)
         ========================================================= */
      body.mode-card .mini-container {
        width: 100%;
        max-width: 280px;
        background: rgba(254, 252, 248, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(224, 216, 204, 0.8);
        border-radius: 20px;
        padding: 16px 14px;
        box-shadow: 0 16px 36px rgba(77, 47, 30, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        text-align: center;
        position: relative;
      }
      body.mode-card .mini-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 11px;
        color: var(--muted, #7c7267);
      }
      body.mode-card .mini-brand {
        font-family: var(--display, serif);
        font-weight: 600;
        font-size: 13px;
        color: var(--ink, #1f1d1a);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      body.mode-card .mini-brand span { color: var(--accent, #ea5a47); }
      body.mode-card .mini-controls {
        display: flex;
        gap: 4px;
      }
      body.mode-card .mini-btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 11px;
        cursor: pointer;
        color: var(--ink, #1f1d1a);
        transition: background 0.15s ease;
      }
      body.mode-card .mini-btn:hover { background: rgba(0,0,0,0.08); }
      body.mode-card .mini-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        position: relative;
      }
      body.mode-card .mini-art-wrapper {
        position: relative;
        width: 140px;
        height: 155px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      body.mode-card .mini-art {
        width: 130px;
        height: 145px;
        background-color: #f2ede5;
        background-repeat: no-repeat;
        background-size: 800% 900%;
        border-radius: 45% 45% 39% 39%;
        box-shadow: 0 10px 20px rgba(77, 47, 30, 0.12);
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      body.mode-card .mini-art:hover { transform: scale(1.04); }
      body.mode-card .mini-art:active { transform: scale(0.96); }
      body.mode-card .mini-art.gif-pet {
        background-size: contain !important;
        background-position: center center !important;
      }
      body.mode-card .mini-name {
        font-family: var(--display, serif);
        font-size: 18px;
        font-weight: 700;
        color: var(--ink, #1f1d1a);
        margin: 0;
      }
      body.mode-card .mini-badge {
        font-size: 11px;
        color: var(--accent, #ea5a47);
        font-weight: 600;
      }
      body.mode-card .mini-quote {
        font-size: 11px;
        font-style: italic;
        color: var(--muted, #7c7267);
        margin: 2px 0 6px;
        line-height: 1.3;
        min-height: 28px;
      }
      body.mode-card .mini-card-actions {
        display: flex;
        gap: 6px;
        justify-content: center;
        align-items: center;
      }
      body.mode-card .mini-card-pat-btn {
        background: var(--accent, #ea5a47);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(234, 90, 71, 0.25);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      body.mode-card .mini-card-pat-btn:hover { background: #d94936; transform: translateY(-1px); }
      body.mode-card .mini-card-pat-btn:active { transform: translateY(1px); }
      body.mode-card .mini-card-pip-btn {
        background: rgba(0,0,0,0.05);
        color: var(--ink, #1f1d1a);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      body.mode-card .mini-card-pip-btn:hover { background: rgba(0,0,0,0.09); }
      body.mode-card .mini-status-bar {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted, #7c7267);
      }
      body.mode-card .mini-status-bar span { display: flex; align-items: center; gap: 4px; }
      body.mode-card .mini-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #52a447;
        box-shadow: 0 0 6px rgba(82, 164, 71, 0.6);
      }
      /* Hide card actions in sprite mode */
      body.mode-sprite .mini-card-actions {
        display: none !important;
      }
    </style>
  </head>
  <body class="mini-body mode-sprite transparent-bg" id="mini-body">
    <div class="mini-container" id="mini-container" data-tauri-drag-region>
      <div class="pet-particles" id="mini-particles" aria-hidden="true"></div>
      
      <!-- Card Topbar (Visible in Card Mode) -->
      <div class="mini-topbar" data-tauri-drag-region>
        <div class="mini-brand" data-tauri-drag-region>Nuzzle<span>·</span> companion</div>
        <div class="mini-controls">
          <button class="mini-btn" id="mini-switch-btn-card" title="Cycle to next pet">next ↻</button>
          <button class="mini-btn" id="mini-mode-toggle-card" title="Switch to Desktop Sprite Mode">👻 sprite</button>
          <button class="mini-btn" id="mini-pip-top-btn" title="Hide the floating companion">hide ×</button>
        </div>
      </div>

      <!-- Stage / Character Sprite -->
      <div class="mini-stage" data-tauri-drag-region>
        <div class="mini-badge" id="mini-badge">✦ active companion</div>
        <div class="mini-art-wrapper" id="mini-art-wrapper" data-tauri-drag-region>
          <div class="mini-art state-idle" id="mini-art" data-tauri-drag-region title="Left-click to pat, right-click for menu, drag to move!"></div>
        </div>
        <h2 class="mini-name" id="mini-name">Hu Tao</h2>
        <div class="mini-quote" id="mini-quote">“If there's work to do, I'll haunt it.”</div>
      </div>

      <!-- Compact Floating Micro-Dock & Dropdown (Desktop Sprite Mode) -->
      <div class="mini-hud" id="mini-hud">
        <div class="mini-pill-dock" id="mini-pill-dock">
          <button class="mini-pill-btn mini-dropdown-trigger" id="mini-menu-trigger" title="Companion Menu">⋯</button>
        </div>

        <div class="mini-dropdown-menu" id="mini-dropdown-menu" role="menu">
          <button class="mini-menu-item" id="mini-walk-btn" role="menuitem">
            <span class="menu-icon" id="walk-menu-icon"></span>
            <span id="walk-menu-text">Toggle walk</span>
          </button>
          <button class="mini-menu-item" id="mini-switch-btn" role="menuitem">
            <span class="menu-icon" id="switch-menu-icon"></span>
            <span>Next pet</span>
          </button>
          <button class="mini-menu-item" id="mini-agent-alerts-btn" role="menuitem" title="Toggle agent messages above pet">
            <span class="menu-icon" id="agent-alerts-menu-icon"></span>
            <span id="agent-alerts-menu-text">Agent alerts: Off</span>
          </button>
          <div class="menu-divider"></div>
          <button class="mini-menu-item" id="mini-mode-toggle-btn" role="menuitem">
            <span class="menu-icon" id="mode-menu-icon"></span>
            <span id="mode-menu-text">Card mode</span>
          </button>
          <button class="mini-menu-item" id="mini-pip-btn" role="menuitem">
            <span class="menu-icon" id="pip-menu-icon"></span>
            <span>Open studio</span>
          </button>
          <div class="menu-divider"></div>
          <button class="mini-menu-item item-danger" id="mini-hide-btn" role="menuitem">
            <span class="menu-icon" id="hide-menu-icon"></span>
            <span>Hide companion</span>
          </button>
        </div>
      </div>

      <!-- Card Mode Actions (Visible only in Card Mode) -->
      <div class="mini-card-actions" id="mini-card-actions">
        <button class="mini-card-pat-btn" id="mini-card-pat-btn">♡ pat companion</button>
        <button class="mini-card-pip-btn" id="mini-card-pip-btn" title="Open Nuzzle Studio">⌂ open studio</button>
      </div>

      <!-- Card Status Bar (Visible in Card Mode) -->
      <div class="mini-status-bar">
        <span><i class="mini-dot"></i> <span id="mini-state-text">idle state</span></span>
        <span id="mini-vibe-text">local & quiet</span>
      </div>
    </div>

    <!-- TOAST REGION -->
    <div class="toast-region" aria-live="polite"></div>

    <script src="/app.js"></script>
    <script>
      // Mini companion page logic
      document.addEventListener('DOMContentLoaded', () => {
        const miniBody = document.getElementById('mini-body');
        const miniArt = document.getElementById('mini-art');
        const miniName = document.getElementById('mini-name');
        const miniQuote = document.getElementById('mini-quote');
        const miniBadge = document.getElementById('mini-badge');
        const miniStateText = document.getElementById('mini-state-text');
        const miniVibeText = document.getElementById('mini-vibe-text');
        const miniHud = document.getElementById('mini-hud');
        const miniMenuTrigger = document.getElementById('mini-menu-trigger');
        const miniWalkBtn = document.getElementById('mini-walk-btn');
        const miniSwitchBtn = document.getElementById('mini-switch-btn');
        const miniSwitchBtnCard = document.getElementById('mini-switch-btn-card');
        const miniAgentAlertsBtn = document.getElementById('mini-agent-alerts-btn');
        const miniModeToggleBtn = document.getElementById('mini-mode-toggle-btn');
        const miniModeToggleCard = document.getElementById('mini-mode-toggle-card');
        const miniPipBtn = document.getElementById('mini-pip-btn');
        const miniPipTopBtn = document.getElementById('mini-pip-top-btn');
        const miniHideBtn = document.getElementById('mini-hide-btn');
        const miniCardPatBtn = document.getElementById('mini-card-pat-btn');
        const miniCardPipBtn = document.getElementById('mini-card-pip-btn');

        // Clean Vector SVG Icons
        const ICONS = {
          walk: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="5" r="2"/><path d="m9 20 3-6 3 2 3 5"/><path d="m6 17 3-3 3 1"/><path d="M14 11V8l4 2"/></svg>',
          rest: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>',
          next: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 0 0-9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/><path d="M3 12a9 9 0 0 0 9 9 9.75 9.75 0 0 0 6.74-2.74L21 16"/><path d="M16 16h5v5"/></svg>',
          bellOff: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><path d="m2 2 20 20"/><path d="M8.6 8.6a6 6 0 0 0-.6 3.4c0 7-3 9-3 9h14.4"/><path d="M18 13.8c0-3-1.6-5.4-4-6.4"/></svg>',
          bellOn: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>',
          cardMode: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M3 9h18"/><path d="M9 21V9"/></svg>',
          spriteMode: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/></svg>',
          studio: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>',
          hide: '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>'
        };

        // Agent Alerts Setting (Default OFF)
        let agentAlertsEnabled = localStorage.getItem('nuzzle_agent_alerts') === 'true';

        function updateAgentAlertsUI() {
          const icon = document.getElementById('agent-alerts-menu-icon');
          const text = document.getElementById('agent-alerts-menu-text');
          if (icon) {
            icon.innerHTML = agentAlertsEnabled ? ICONS.bellOn : ICONS.bellOff;
            icon.style.color = agentAlertsEnabled ? 'var(--coral, #ef7861)' : '';
          }
          if (text) {
            text.textContent = agentAlertsEnabled ? 'Agent alerts: On' : 'Agent alerts: Off';
          }
        }

        // Mode Management: 'sprite' (Codex-style) or 'card'
        let currentMode = localStorage.getItem('nuzzle_companion_mode') || 'sprite';
        let isWalking = false;
        let isShiftedForMenu = false;

        function updateCompanionWindowSize() {
          if (!IS_NATIVE_APP) return;
          if (currentMode === 'card') {
            invokeNative('set_companion_size', { width: 280, height: 380 }).catch(() => {});
          } else {
            const isMenuOpen = miniHud && miniHud.classList.contains('menu-open');
            if (isMenuOpen) {
              const screenWidth = (window.screen && (window.screen.availWidth || window.screen.width)) || 1920;
              const currentX = window.screenX !== undefined ? window.screenX : 0;
              const currentY = window.screenY !== undefined ? window.screenY : 0;
              const willOverflowRight = (currentX + 375) > screenWidth;

              if (willOverflowRight) {
                document.body.classList.add('menu-left');
                isShiftedForMenu = true;
                invokeNative('set_companion_position', { x: Math.max(0, currentX - 165), y: currentY }).catch(() => {});
              } else {
                document.body.classList.remove('menu-left');
                isShiftedForMenu = false;
              }
              invokeNative('set_companion_size', { width: 365, height: 220 }).catch(() => {});
            } else {
              if (isShiftedForMenu) {
                const currentX = window.screenX !== undefined ? window.screenX : 0;
                const currentY = window.screenY !== undefined ? window.screenY : 0;
                invokeNative('set_companion_position', { x: currentX + 165, y: currentY }).catch(() => {});
                isShiftedForMenu = false;
              }
              document.body.classList.remove('menu-left');
              invokeNative('set_companion_size', { width: 200, height: 220 }).catch(() => {});
            }
          }
        }

        // Dropdown toggle management
        function toggleMenu(force) {
          if (!miniHud) return;
          const shouldOpen = typeof force === 'boolean' ? force : !miniHud.classList.contains('menu-open');
          if (shouldOpen === miniHud.classList.contains('menu-open')) return;
          miniHud.classList.toggle('menu-open', shouldOpen);
          updateCompanionWindowSize();
        }

        if (miniMenuTrigger) {
          miniMenuTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            toggleMenu();
          });
        }

        // Right-click on sprite opens menu
        if (miniArt) {
          miniArt.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            e.stopPropagation();
            toggleMenu(true);
          });
        }

        // Click outside closes menu
        document.addEventListener('click', (e) => {
          if (miniHud && !miniHud.contains(e.target)) {
            toggleMenu(false);
          }
        });

        // Close menu after clicking any dropdown item
        document.querySelectorAll('.mini-dropdown-menu .mini-menu-item').forEach(item => {
          item.addEventListener('click', () => {
            toggleMenu(false);
          });
        });

        function setCompanionMode(mode) {
          currentMode = mode;
          localStorage.setItem('nuzzle_companion_mode', mode);
          const modeIcon = document.getElementById('mode-menu-icon');
          const modeText = document.getElementById('mode-menu-text');

          if (mode === 'card') {
            miniBody.classList.remove('mode-sprite');
            miniBody.classList.add('mode-card');
            if (modeIcon) modeIcon.innerHTML = ICONS.spriteMode;
            if (modeText) modeText.textContent = 'Sprite mode';
            if (miniModeToggleBtn) miniModeToggleBtn.title = 'Switch to Desktop Sprite Mode';
          } else {
            miniBody.classList.remove('mode-card');
            miniBody.classList.add('mode-sprite');
            if (modeIcon) modeIcon.innerHTML = ICONS.cardMode;
            if (modeText) modeText.textContent = 'Card mode';
            if (miniModeToggleBtn) miniModeToggleBtn.title = 'Switch to Widget Card Mode';
          }
          updateCompanionWindowSize();
        }
        setCompanionMode(currentMode);

        function initMenuIcons() {
          const switchIcon = document.getElementById('switch-menu-icon');
          if (switchIcon) switchIcon.innerHTML = ICONS.next;
          const pipIcon = document.getElementById('pip-menu-icon');
          if (pipIcon) pipIcon.innerHTML = ICONS.studio;
          const hideIcon = document.getElementById('hide-menu-icon');
          if (hideIcon) hideIcon.innerHTML = ICONS.hide;
          const walkIcon = document.getElementById('walk-menu-icon');
          if (walkIcon) walkIcon.innerHTML = isWalking ? ICONS.rest : ICONS.walk;
          const modeIcon = document.getElementById('mode-menu-icon');
          if (modeIcon) modeIcon.innerHTML = currentMode === 'card' ? ICONS.spriteMode : ICONS.cardMode;
          updateAgentAlertsUI();
        }
        initMenuIcons();

        if (miniAgentAlertsBtn) {
          miniAgentAlertsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            agentAlertsEnabled = !agentAlertsEnabled;
            localStorage.setItem('nuzzle_agent_alerts', agentAlertsEnabled ? 'true' : 'false');
            updateAgentAlertsUI();
            if ('BroadcastChannel' in window) {
              const channel = new BroadcastChannel('nuzzle-agent-alerts');
              channel.postMessage({ agentAlerts: agentAlertsEnabled });
            }
            showToast(agentAlertsEnabled ? 'Agent alerts enabled' : 'Agent alerts turned off', { force: true, duration: 2500 });
          });
        }

        if (miniModeToggleBtn) {
          miniModeToggleBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            setCompanionMode(currentMode === 'sprite' ? 'card' : 'sprite');
            showToast(`Switched to ${currentMode === 'sprite' ? 'Desktop Sprite' : 'Widget Card'} mode!`, { force: true });
          });
        }
        if (miniModeToggleCard) {
          miniModeToggleCard.addEventListener('click', (e) => {
            e.stopPropagation();
            setCompanionMode('sprite');
            showToast('Switched to Desktop Sprite mode!', { force: true });
          });
        }

        // Walk / Idle animation toggle
        if (miniWalkBtn) {
          miniWalkBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            isWalking = !isWalking;
            const targetState = isWalking ? 'walk' : 'idle';
            if (typeof setPetState === 'function') {
              setPetState(targetState);
            } else {
              state.activePetState = targetState;
            }
            const walkIcon = document.getElementById('walk-menu-icon');
            const walkText = document.getElementById('walk-menu-text');
            if (walkIcon) walkIcon.innerHTML = isWalking ? ICONS.rest : ICONS.walk;
            if (walkText) walkText.textContent = isWalking ? 'Rest companion' : 'Toggle walk';
            updateMiniUI();
            showToast(isWalking ? 'Companion is now walking!' : 'Companion is now resting.', { force: true });
          });
        }

        // Dynamic Running Animation & Movement Tracking Engine
        let isMoving = false;
        let moveStopTimer = null;
        let isPointerDown = false;
        let didDrag = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function setRunningState(direction) {
          const moveClass = direction < 0 ? 'walk-left' : 'walk';
          if (state.activePetState !== moveClass) {
            state.activePetState = moveClass;
            if (miniArt) {
              const pet = PETS.find(p => p.id === state.selectedPetId) || PETS[0];
              miniArt.className = `mini-art state-${moveClass}${pet.ext === 'gif' ? ' gif-pet' : ''}`;
            }
          }
        }

        function clearRunningState() {
          clearTimeout(moveStopTimer);
          moveStopTimer = setTimeout(() => {
            isMoving = false;
            // Return to idle state (or walk if user specifically set permanent walk)
            const baseState = isWalking ? 'walk' : 'idle';
            state.activePetState = baseState;
            updateMiniUI();
          }, 240);
        }

        function handlePetMove(deltaX) {
          isMoving = true;
          setRunningState(deltaX);
          clearRunningState();
        }
        window.handlePetMove = handlePetMove;

        // 1. Listen for native window move events from Tauri backend
        if (window.__TAURI__?.event) {
          window.__TAURI__.event.listen('companion-moved', (event) => {
            const payload = event.payload || {};
            handlePetMove(payload.dx || 0);
          });
        }

        // 2. Continuous window position delta tracking (catches all OS window dragging)
        let prevScreenX = window.screenX;
        let prevScreenY = window.screenY;
        setInterval(() => {
          const curX = window.screenX;
          const curY = window.screenY;
          const dx = curX - prevScreenX;
          const dy = curY - prevScreenY;
          prevScreenX = curX;
          prevScreenY = curY;

          if (Math.abs(dx) > 1 || Math.abs(dy) > 1) {
            handlePetMove(dx);
            if (miniHud && miniHud.classList.contains('menu-open')) {
              toggleMenu(false);
            }
          }
        }, 30);

        // 3. Pointer drag tracking on container and art
        const miniContainer = document.getElementById('mini-container');
        if (miniContainer) {
          miniContainer.addEventListener('pointerdown', (e) => {
            if (e.button !== 0) return;
            isPointerDown = true;
            didDrag = false;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
          });
        }

        window.addEventListener('pointermove', (e) => {
          if (!isPointerDown) return;
          const dx = e.screenX - dragStartX;
          const dy = e.screenY - dragStartY;
          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) {
            didDrag = true;
            dragStartX = e.screenX;
            dragStartY = e.screenY;
            handlePetMove(dx);
            if (miniHud && miniHud.classList.contains('menu-open')) {
              toggleMenu(false);
            }
          }
        });

        window.addEventListener('pointerup', () => {
          isPointerDown = false;
          if (didDrag) {
            clearRunningState();
            // Keep didDrag true briefly to swallow the trailing click event
            setTimeout(() => { didDrag = false; }, 80);
          }
        });

        window.addEventListener('pointercancel', () => {
          isPointerDown = false;
          if (didDrag) {
            clearRunningState();
            setTimeout(() => { didDrag = false; }, 80);
          }
        });

        // Self-contained speech bubble & toast notification system in mini companion
        window.showToast = function(message, options = {}) {
          const text = String(message || '').trim();
          if (!text) return;

          // Detect agent activity notifications
          const isAgentEvent = options?.isAgent || options?.source === 'agent' ||
            ['prompt', 'tool', 'working', 'wait', 'done', 'error'].includes(options?.type) ||
            /^(Antigravity|Claude|Codex|Gemini|Cursor|Agent)\b/i.test(text);

          // By default agent alerts are OFF. Do not create toast unless enabled or explicitly forced
          if (isAgentEvent && !agentAlertsEnabled && !options?.force) {
            return;
          }

          const region = document.querySelector('.toast-region');
          if (!region) return;

          // Clear any active toasts so there's always one clean bubble
          while (region.firstChild) {
            region.removeChild(region.firstChild);
          }

          const toast = document.createElement('div');
          toast.className = 'toast';

          const iconSpan = document.createElement('span');
          let icon = options?.icon || '';
          if (!icon) {
            if (options?.type === 'done' || text.toLowerCase().includes('complete') || text.toLowerCase().includes('finish') || text.toLowerCase().includes('done')) {
              icon = '✓';
            } else if (options?.type === 'error' || text.toLowerCase().includes('error') || text.toLowerCase().includes('fail')) {
              icon = '!';
            } else if (options?.type === 'pat' || text.includes('♡') || text.includes('pat') || text.includes('happy') || text.includes('purr')) {
              icon = '♡';
            } else {
              icon = '✨';
            }
          }
          iconSpan.textContent = icon;
          toast.appendChild(iconSpan);

          let cleanText = text;
          if (cleanText.startsWith('✓ ') || cleanText.startsWith('! ') || cleanText.startsWith('♡ ') || cleanText.startsWith('✨ ') || cleanText.startsWith('✦ ')) {
            cleanText = cleanText.substring(2).trim();
          }

          const textSpan = document.createElement('span');
          textSpan.className = 'toast-text';
          textSpan.textContent = cleanText;
          toast.appendChild(textSpan);

          region.appendChild(toast);

          // Auto fade after 3.2 seconds
          const duration = options?.duration || 3200;
          setTimeout(() => {
            toast.classList.add('fade');
            setTimeout(() => {
              if (toast.parentNode === region) {
                toast.remove();
              }
            }, 250);
          }, duration);
        };

        function updateMiniUI() {
          const pet = PETS.find(p => p.id === state.selectedPetId) || PETS[0];
          if (miniArt) {
            miniArt.style.backgroundImage = `url('${petUrl(pet)}')`;
            const activeState = state.activePetState || (isWalking ? 'walk' : 'idle');
            miniArt.className = `mini-art state-${activeState}${pet.ext === 'gif' ? ' gif-pet' : ''}`;
          }
          if (miniName) miniName.textContent = pet.name;
          if (miniQuote) miniQuote.textContent = pet.quote;
          if (miniBadge) miniBadge.textContent = `✦ ${pet.note || pet.badge}`;
          if (miniVibeText) miniVibeText.textContent = `${pet.vibe} · ${pet.element}`;
          if (miniStateText) miniStateText.textContent = `${state.activePetState || 'idle'} state`;
        }

        window.updateMiniUI = updateMiniUI;
        updateMiniUI();

        // Patting triggers — in Codex Pets, tapping the pet speaks a dialogue above its head
        function handlePat() {
          const pet = PETS.find(p => p.id === state.selectedPetId) || PETS[0];
          if (typeof patActivePet === 'function') {
            patActivePet();
          } else {
            if (typeof setPetState === 'function') {
              setPetState('pat', 2200);
            } else {
              state.activePetState = 'pat';
            }
            if (typeof createHeartBurst === 'function') createHeartBurst();
            if (typeof playChime === 'function') playChime('pat');
          }

          // Companion speaks their quote or interactive phrase directly above their head
          const cleanQuote = pet.quote ? pet.quote.replace(/^["“]|["”]$/g, '').trim() : '';
          const phrases = [
            cleanQuote ? `“${cleanQuote}”` : null,
            `♡ ${pet.name} is happy!`,
            `✨ Keep up the great coding!`,
            `♡ (purrs softly)`
          ].filter(Boolean);
          const chosen = phrases[Math.floor(Math.random() * phrases.length)];
          window.showToast(chosen, { icon: '♡', type: 'pat', force: true, duration: 3200 });
          updateMiniUI();
        }

        const miniArtWrapper = document.getElementById('mini-art-wrapper');
        if (miniArtWrapper) {
          miniArtWrapper.addEventListener('click', (e) => {
            if (didDrag) return;
            handlePat();
          });
        }

        if (miniArt) {
          miniArt.addEventListener('click', (e) => {
            if (didDrag) return;
            handlePat();
          });
        }
        if (miniPatBtn) {
          miniPatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePat();
          });
        }
        if (miniCardPatBtn) {
          miniCardPatBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            handlePat();
          });
        }

        // Cycle to next companion
        function cycleNextPet() {
          const idx = PETS.findIndex(p => p.id === state.selectedPetId);
          const nextIdx = (idx + 1) % PETS.length;
          if (typeof selectCompanion === 'function') {
            selectCompanion(PETS[nextIdx].id);
          }
          updateMiniUI();
        }

        if (miniSwitchBtn) {
          miniSwitchBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            cycleNextPet();
          });
        }
        if (miniSwitchBtnCard) {
          miniSwitchBtnCard.addEventListener('click', (e) => {
            e.stopPropagation();
            cycleNextPet();
          });
        }

        // Studio & Hide triggers
        async function openStudio() {
          if (IS_NATIVE_APP) {
            try { await invokeNative('show_studio'); } catch (error) { showToast(String(error)); }
          } else if (typeof floatPetOnDesktop === 'function') {
            floatPetOnDesktop();
          }
        }
        async function hideCompanion() {
          if (IS_NATIVE_APP) {
            try { await invokeNative('hide_companion'); } catch (error) { showToast(String(error)); }
          } else {
            window.close();
          }
        }

        if (miniPipBtn) {
          miniPipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openStudio();
          });
        }
        if (miniCardPipBtn) {
          miniCardPipBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            openStudio();
          });
        }
        if (miniPipTopBtn) {
          miniPipTopBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideCompanion();
          });
        }
        if (miniHideBtn) {
          miniHideBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            hideCompanion();
          });
        }

        // Cross-window storage & BroadcastChannel synchronization
        window.addEventListener('storage', (e) => {
          if (e.key === 'nuzzle_selected_pet_v1') {
            try { state.selectedPetId = JSON.parse(e.newValue) || 'hu-tao'; }
            catch { state.selectedPetId = 'hu-tao'; }
            updateMiniUI();
          }
          if (e.key === 'nuzzle_companion_mode' && e.newValue) {
            setCompanionMode(e.newValue);
          }
        });

        if ('BroadcastChannel' in window) {
          const petChannel = new BroadcastChannel('nuzzle-pet-selection');
          petChannel.addEventListener('message', event => {
            if (event.data?.petId) {
              state.selectedPetId = event.data.petId;
              updateMiniUI();
            }
            if (event.data?.companionMode) {
              setCompanionMode(event.data.companionMode);
            }
          });
        }
      });
    </script>
  </body>
</html>
