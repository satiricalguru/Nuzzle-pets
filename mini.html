<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nuzzle — Mini Companion</title>
    <link rel="icon" type="image/svg+xml" href="/public/nuzzle-logo.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/styles.css" />
    <style>
      body.mini-body {
        margin: 0;
        padding: 12px;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: transparent;
        overflow: hidden;
      }
      .mini-container {
        width: 100%;
        max-width: 280px;
        background: rgba(254, 252, 248, 0.94);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid rgba(224, 216, 204, 0.8);
        border-radius: 20px;
        padding: 16px 14px;
        box-shadow: 0 16px 36px rgba(77, 47, 30, 0.14), 0 0 0 1px rgba(255, 255, 255, 0.6) inset;
        text-align: center;
        position: relative;
        user-select: none;
      }
      .mini-topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
        font-size: 11px;
        color: var(--muted, #7c7267);
      }
      .mini-brand {
        font-family: var(--display, serif);
        font-weight: 600;
        font-size: 13px;
        color: var(--ink, #1f1d1a);
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .mini-brand span { color: var(--accent, #ea5a47); }
      .mini-controls {
        display: flex;
        gap: 4px;
      }
      .mini-btn {
        background: rgba(0,0,0,0.04);
        border: 1px solid rgba(0,0,0,0.06);
        border-radius: 6px;
        padding: 2px 6px;
        font-size: 11px;
        cursor: pointer;
        color: var(--ink, #1f1d1a);
        transition: background 0.15s ease;
      }
      .mini-btn:hover { background: rgba(0,0,0,0.08); }
      .mini-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 8px;
        margin: 6px 0;
        position: relative;
      }
      .mini-art-wrapper {
        position: relative;
        width: 140px;
        height: 155px;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .mini-art {
        width: 130px;
        height: 145px;
        background-color: #f2ede5;
        background-repeat: no-repeat;
        background-size: 800% 900%;
        border-radius: 45% 45% 39% 39%;
        box-shadow: 0 10px 20px rgba(77, 47, 30, 0.12);
        cursor: pointer;
        transition: transform 0.15s ease;
      }
      .mini-art:hover { transform: scale(1.04); }
      .mini-art:active { transform: scale(0.96); }
      .mini-art.gif-pet {
        background-size: contain !important;
        background-position: center center !important;
      }
      .mini-name {
        font-family: var(--display, serif);
        font-size: 18px;
        font-weight: 700;
        color: var(--ink, #1f1d1a);
        margin: 0;
      }
      .mini-badge {
        font-size: 11px;
        color: var(--accent, #ea5a47);
        font-weight: 600;
      }
      .mini-quote {
        font-size: 11px;
        font-style: italic;
        color: var(--muted, #7c7267);
        margin: 2px 0 6px;
        line-height: 1.3;
        min-height: 28px;
      }
      .mini-actions {
        display: flex;
        gap: 6px;
        justify-content: center;
      }
      .mini-pat-btn {
        background: var(--accent, #ea5a47);
        color: #fff;
        border: none;
        border-radius: 12px;
        padding: 6px 14px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 10px rgba(234, 90, 71, 0.25);
        transition: transform 0.15s ease, background 0.15s ease;
      }
      .mini-pat-btn:hover { background: #d94936; transform: translateY(-1px); }
      .mini-pat-btn:active { transform: translateY(1px); }
      .mini-pip-btn {
        background: rgba(0,0,0,0.05);
        color: var(--ink, #1f1d1a);
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 12px;
        padding: 6px 10px;
        font-size: 12px;
        font-weight: 500;
        cursor: pointer;
        transition: background 0.15s ease;
      }
      .mini-pip-btn:hover { background: rgba(0,0,0,0.09); }
      .mini-status-bar {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid rgba(0,0,0,0.06);
        display: flex;
        justify-content: space-between;
        font-size: 10px;
        color: var(--muted, #7c7267);
      }
      .mini-status-bar span { display: flex; align-items: center; gap: 4px; }
      .mini-dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #52a447;
        box-shadow: 0 0 6px rgba(82, 164, 71, 0.6);
      }
    </style>
  </head>
  <body class="mini-body">
    <div class="mini-container" id="mini-container">
      <div class="pet-particles" id="mini-particles" aria-hidden="true"></div>
      <div class="mini-topbar">
        <div class="mini-brand">nuzzle<span>·</span> companion</div>
        <div class="mini-controls">
          <button class="mini-btn" id="mini-switch-btn" title="Cycle to next pet">next ↻</button>
          <button class="mini-btn" id="mini-pip-top-btn" title="Always on Top Picture-in-Picture">float ❐</button>
        </div>
      </div>

      <div class="mini-stage">
        <div class="mini-badge" id="mini-badge">✦ active companion</div>
        <div class="mini-art-wrapper">
          <div class="mini-art state-idle" id="mini-art" title="Click to pat!"></div>
        </div>
        <h2 class="mini-name" id="mini-name">Hu Tao</h2>
        <div class="mini-quote" id="mini-quote">“If there's work to do, I'll haunt it.”</div>
      </div>

      <div class="mini-actions">
        <button class="mini-pat-btn" id="mini-pat-btn">♡ pat companion</button>
        <button class="mini-pip-btn" id="mini-pip-btn" title="Float always-on-top over Antigravity IDE">❐ float on desktop</button>
      </div>

      <div class="mini-status-bar">
        <span><i class="mini-dot"></i> <span id="mini-state-text">idle state</span></span>
        <span id="mini-vibe-text">local & quiet</span>
      </div>
    </div>

    <!-- TOAST REGION -->
    <div class="toast-region" aria-live="polite"></div>

    <script src="/app.js"></script>
    <script>
      // Mini page specific wiring
      document.addEventListener('DOMContentLoaded', () => {
        const miniArt = document.getElementById('mini-art');
        const miniName = document.getElementById('mini-name');
        const miniQuote = document.getElementById('mini-quote');
        const miniBadge = document.getElementById('mini-badge');
        const miniStateText = document.getElementById('mini-state-text');
        const miniVibeText = document.getElementById('mini-vibe-text');
        const miniPatBtn = document.getElementById('mini-pat-btn');
        const miniSwitchBtn = document.getElementById('mini-switch-btn');
        const miniPipBtn = document.getElementById('mini-pip-btn');
        const miniPipTopBtn = document.getElementById('mini-pip-top-btn');

        function updateMiniUI() {
          const pet = PETS.find(p => p.id === state.selectedPetId) || PETS[0];
          if (miniArt) {
            miniArt.style.backgroundImage = `url('${petUrl(pet)}')`;
            miniArt.className = `mini-art state-${state.activePetState || 'idle'}${pet.ext === 'gif' ? ' gif-pet' : ''}`;
          }
          if (miniName) miniName.textContent = pet.name;
          if (miniQuote) miniQuote.textContent = pet.quote;
          if (miniBadge) miniBadge.textContent = `✦ ${pet.note || pet.badge}`;
          if (miniVibeText) miniVibeText.textContent = `${pet.vibe} · ${pet.element}`;
          if (miniStateText) miniStateText.textContent = `${state.activePetState || 'idle'} state`;
        }

        updateMiniUI();

        if (miniArt) {
          miniArt.addEventListener('click', () => {
            if (typeof patActivePet === 'function') patActivePet();
            updateMiniUI();
          });
        }
        if (miniPatBtn) {
          miniPatBtn.addEventListener('click', () => {
            if (typeof patActivePet === 'function') patActivePet();
            updateMiniUI();
          });
        }

        if (miniSwitchBtn) {
          miniSwitchBtn.addEventListener('click', () => {
            const idx = PETS.findIndex(p => p.id === state.selectedPetId);
            const nextIdx = (idx + 1) % PETS.length;
            if (typeof selectCompanion === 'function') {
              selectCompanion(PETS[nextIdx].id);
            }
            updateMiniUI();
          });
        }

        if (miniPipBtn) {
          miniPipBtn.addEventListener('click', () => {
            if (typeof floatPetOnDesktop === 'function') floatPetOnDesktop();
          });
        }
        if (miniPipTopBtn) {
          miniPipTopBtn.addEventListener('click', () => {
            if (typeof floatPetOnDesktop === 'function') floatPetOnDesktop();
          });
        }

        // Listen for storage or channel sync
        window.addEventListener('storage', (e) => {
          if (e.key === 'nuzzle_selected_pet_v1') {
            state.selectedPetId = e.newValue || 'hu-tao';
            updateMiniUI();
          }
        });
      });
    </script>
  </body>
</html>
